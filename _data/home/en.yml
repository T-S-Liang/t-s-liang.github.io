hero:
  badges:
    - { kind: whu, label: "B.S.", value: "WHU (2020–2024)" }
    - { kind: hku, label: "Ph.D.", value: "HKU (2024–Present)" }
  badges_label: "Degrees"
  tagline: 'My research focuses on <strong>computer vision</strong>, <strong>representation learning</strong>, and <strong>generative models</strong>.'
  paragraphs:
    - '🧑‍🎓 I’m a second-year Ph.D. student at the <a href="https://www.eee.hku.hk">Department of Electrical and Computer Engineering, The University of Hong Kong</a>. I am very fortunate to be advised by Prof. <a href="https://www.eee.hku.hk/people/h-wang">Han Wang</a> and Prof. <a href="https://xh-liu.github.io">Xihui Liu</a>. I’m now a student research intern at Motus AI, Tencent Games, mentored by Dr. <a href="https://li-ronghui.github.io">Ronghui Li</a>.'
    - '🔬 Before joining HKU, I obtained my undergraduate degree in Physics from <a href="https://physics.whu.edu.cn">School of Physics and Technology, Wuhan University</a>. During my undergraduate years, I spent a wonderful time at <a href="https://genra.ai">Genra.ai</a>, under the supervision of Dr. <a href="https://guozhang.mit.edu/guos-personal-home">Guo Zhang</a> and the guidance of Prof. <a href="https://www.yingcong.me">Yingcong Chen</a> and Prof. <a href="https://yyuanad.github.io">Yuan Yuan</a>; we have maintained a strong and frequent research collaboration ever since. I also worked on interesting topics in condensed matter physics and AI for science under the guidance of Prof. <a href="http://yuan.whu.edu.cn">Shengjun Yuan</a> and Prof. <a href="http://jszy.whu.edu.cn/zhangshunping/en/index.htm#">Shunping Zhang</a>.'
  contact:
    email_label: "Email:"
    emails:
      - tsliang2001@gmail.com
      - sliang57@connect.hku.hk
      - liangshuang@whu.edu.cn
    email_separator: " or "
    wechat: 'You may also follow my WeChat Official Account <strong>@Teemo.log</strong>. It is a place where I share daily updates and personal thoughts. Articles from my WeChat Official Account are Chinese only.'

news:
  title: "What's New"
  aria_label: "Latest updates"
  more_label: "Earlier news"
  items:
    - date: "[08/2026]"
      tag: "🎉 SDPose @ ECCV 2026 Workshop:"
      body: 'We will present <strong>SDPose</strong> at the ECCV 2026 Workshop on <a href="https://human-motion-world-model.github.io/">Human Motion-Informed World Models and Socially Intelligent Action (HuMoWM)</a> in Malmö, Sweden (non-archival). Come say hi if you are around!'
    - date: "[05/2026]"
      tag: "🎉 New Work:"
      body: 'Our new paper <a href="https://arxiv.org/abs/2605.09591">From Pixels to Concepts (CAFE)</a> is now on arXiv.'
    - date: "[04/2026]"
      tag: "🎉 SDPose is officially hosted by Comfy Org!:"
      body: 'Our SDPose is now natively supported in ComfyUI. See the <a href="https://docs.comfy.org/tutorials/utility/pose-detection-sdpose">official tutorial</a>, the Comfy-Org <a href="https://huggingface.co/Comfy-Org/SDPose">HF Model</a>, and try the ready-to-run <a href="https://comfy.org/workflows/utility_sdpose_ood_image_to_pose-5489b3cf2ac1/">OOD Image-to-Pose workflow</a>.'
    - date: "[10/2025]"
      tag: "🎉 Our work SDPose-OOD is getting noticed!:"
      body: 'A big shout-out to the community developers who made a ComfyUI node for SDPose-OOD, making it even easier to integrate into creative workflows. 🙌 Try it out here: <a href="https://github.com/judian17/ComfyUI-SDPose-OOD">ComfyUI Node SDPose-OOD</a>.'
    - date: "[10/2025]"
      tag: "🚀 Open-source of SDPose:"
      body: 'Major code and model release now available: <a href="https://github.com/T-S-Liang/SDPose-OOD">GitHub Repository</a> | <a href="https://huggingface.co/teemosliang/SDPose-Body">HF Model (Body)</a> | <a href="https://huggingface.co/teemosliang/SDPose-Wholebody">HF Model (WholeBody)</a>.'
    - date: "[09/2025]"
      tag: "🍻 IEDM '25:"
      body: "One paper accepted by IEDM 2025. Thank Professor Han Wang, Professor Aoyang Zhang, and Professor Zhongrui Wang for their invaluable guidance, and thank Songqi and Jichang for the smooth collaboration."
  earlier:
    - date: "[09/2025]"
      tag: "🧑‍💻 New paper release:"
      body: "Check out our new work <strong>SDPose</strong> on exploiting the diffusion priors for OOD and robust pose estimation. I'm sooooo excited to share this work. Thank Dr. Guo Zhang, Professor Yingcong Chen, and Professor Yuan Yuan for their invaluable guidance."
    - date: "[01/2025]"
      tag: "🍻 Optica Optics Express '25:"
      body: "One paper for my undergraduate research was accepted by Optics Express. Thank Professor Zhang for his invaluable guidance, and thank Yuze and Haimu for their collaboration and support."
    - date: "[10/2024]"
      tag: "✈️ Enrollment@HKU:"
      body: "New journey started. I began my postgraduate research study at the Department of Electrical and Electronic Engineering at the University of Hong Kong."
    - date: "[06/2024]"
      tag: "🎓 Graduation@WHU:"
      body: 'Received my Bachelor of Science degree in Physics from Wuhan University. I am grateful to have received guidance and enlightenment in computational physics and AI4Sci from Prof. <a href="http://yuan.whu.edu.cn">Shengjun Yuan</a>, and guidance in experimental optoelectronics from Prof. <a href="http://jszy.whu.edu.cn/zhangshunping/en/index.htm#">Shunping Zhang</a> during my undergraduate studies.'
    - date: "[02/2024]"
      tag: "🧑‍💻 Internship@Rama Alpaca:"
      body: 'I started as an MLE research intern at Beijing Rama Alpaca Co. Ltd. in the spring semester under the supervision of Dr. <a href="https://guozhang.mit.edu/guos-personal-home">Guo Zhang</a> from MIT, collaborating with Prof. <a href="https://www.yingcong.me">Yingcong Chen</a> at HKUST and Prof. <a href="https://yyuanad.github.io">Yuan Yuan</a> at Boston College.'
    - date: "[02/2023]"
      tag: "🧑‍💻 Research@CPCS-WHU:"
      body: 'I''ve joined Prof. <a href="http://yuan.whu.edu.cn">Shengjun Yuan</a>''s group at Wuhan University as a research assistant this semester.'
    - date: "[02/2022]"
      tag: "🔬 Research@Xu Lab-WHU:"
      body: 'I''ve joined Prof. <a href="http://jszy.whu.edu.cn/zhangshunping/en/index.htm#">Shunping Zhang</a>''s <a href="https://np.whu.edu.cn">lab</a> at Wuhan University for undergraduate research.'

