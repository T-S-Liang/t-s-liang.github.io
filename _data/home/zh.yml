hero:
  badges:
    - { kind: whu, label: "本科", value: "武汉大学（2020–2024）" }
    - { kind: hku, label: "博士", value: "香港大学（2024 至今）" }
  badges_label: "学位"
  tagline: '我的研究方向是<strong>计算机视觉</strong>、<strong>表征学习</strong>与<strong>生成模型</strong>。'
  paragraphs:
    - '🧑‍🎓 我是<a href="https://www.eee.hku.hk">香港大学电机电子工程系</a>博士二年级学生，非常幸运能由 <a href="https://www.eee.hku.hk/people/h-wang">Han Wang</a> 教授与 <a href="https://xh-liu.github.io">Xihui Liu</a> 教授共同指导。目前我也在腾讯 IEG Motus AI 担任学生研究实习生，由 <a href="https://li-ronghui.github.io">Ronghui Li</a> 博士带教。'
    - '🔬 来港大之前，我在<a href="https://physics.whu.edu.cn">武汉大学物理科学与技术学院</a>取得物理学学士学位。本科期间我在 <a href="https://genra.ai">Genra.ai</a> 度过了一段很愉快的时光，由 <a href="https://guozhang.mit.edu/guos-personal-home">Guo Zhang</a> 博士带教，并得到 <a href="https://www.yingcong.me">Yingcong Chen</a> 教授和 <a href="https://yyuanad.github.io">Yuan Yuan</a> 教授的指导，此后我们一直保持着紧密的科研合作。我也曾在 <a href="http://yuan.whu.edu.cn">Shengjun Yuan</a> 教授和 <a href="http://jszy.whu.edu.cn/zhangshunping/en/index.htm#">Shunping Zhang</a> 教授的指导下，接触过凝聚态物理与 AI for Science 方向的一些有意思的课题。'
  contact:
    email_label: "邮箱："
    emails:
      - tsliang2001@gmail.com
      - sliang57@connect.hku.hk
      - liangshuang@whu.edu.cn
    email_separator: " 或 "
    wechat: '也欢迎关注我的微信公众号 <strong>@Teemo.log</strong>，我在那里写一些日常记录和个人思考，内容均为中文。'

news:
  title: "最新动态"
  aria_label: "最新动态"
  more_label: "更早的动态"
  items:
    - date: "[08/2026]"
      tag: "🎉 SDPose 亮相 ECCV 2026 Workshop："
      body: '我们将在 ECCV 2026 <a href="https://human-motion-world-model.github.io/">Human Motion-Informed World Models and Socially Intelligent Action (HuMoWM)</a> workshop 上展示 SDPose（瑞典马尔默，non-archival）。如果你也在现场，欢迎来聊。'
    - date: "[05/2026]"
      tag: "🎉 新工作："
      body: '新论文 <a href="https://arxiv.org/abs/2605.09591">From Pixels to Concepts (CAFE)</a> 已挂上 arXiv。'
    - date: "[04/2026]"
      tag: "🎉 SDPose 被 Comfy Org 官方收录："
      body: 'SDPose 现已被 ComfyUI 原生支持。可以看<a href="https://docs.comfy.org/tutorials/utility/pose-detection-sdpose">官方教程</a>、Comfy-Org 的 <a href="https://huggingface.co/Comfy-Org/SDPose">HF 模型</a>，也可以直接跑<a href="https://comfy.org/workflows/utility_sdpose_ood_image_to_pose-5489b3cf2ac1/">开箱即用的 OOD Image-to-Pose 工作流</a>。'
    - date: "[10/2025]"
      tag: "🎉 SDPose-OOD 被社区注意到了："
      body: '感谢社区开发者为 SDPose-OOD 做了 ComfyUI 节点，让它更容易接入创作流程。🙌 传送门：<a href="https://github.com/judian17/ComfyUI-SDPose-OOD">ComfyUI Node SDPose-OOD</a>。'
    - date: "[10/2025]"
      tag: "🚀 SDPose 开源："
      body: '代码与模型均已发布：<a href="https://github.com/T-S-Liang/SDPose-OOD">GitHub 仓库</a> | <a href="https://huggingface.co/teemosliang/SDPose-Body">HF 模型（Body）</a> | <a href="https://huggingface.co/teemosliang/SDPose-Wholebody">HF 模型（WholeBody）</a>。'
    - date: "[09/2025]"
      tag: "🍻 IEDM '25："
      body: "一篇论文被 IEDM 2025 接收。感谢 Han Wang 教授、Aoyang Zhang 教授和 Zhongrui Wang 教授的指导，也感谢松琦和继昌一路顺畅的合作。"
  earlier:
    - date: "[09/2025]"
      tag: "🧑‍💻 新论文："
      body: "新工作 <strong>SDPose</strong> 探索如何利用扩散先验做域外与鲁棒的姿态估计。非常兴奋能把这份工作分享出来，感谢 Guo Zhang 博士、Yingcong Chen 教授和 Yuan Yuan 教授的悉心指导。"
    - date: "[01/2025]"
      tag: "🍻 Optics Express '25："
      body: "本科阶段的一篇工作被 Optics Express 接收。感谢张老师的悉心指导，也感谢雨泽和海牧的合作与支持。"
    - date: "[10/2024]"
      tag: "✈️ 入学香港大学："
      body: "新的旅程开始了，我在香港大学电机电子工程系开始了研究型研究生阶段的学习。"
    - date: "[06/2024]"
      tag: "🎓 武汉大学毕业："
      body: '获得武汉大学物理学理学学士学位。感谢本科期间 <a href="http://yuan.whu.edu.cn">Shengjun Yuan</a> 教授在计算物理与 AI4Sci 上的启蒙，以及 <a href="http://jszy.whu.edu.cn/zhangshunping/en/index.htm#">Shunping Zhang</a> 教授在实验光电子方向上的指导。'
    - date: "[02/2024]"
      tag: "🧑‍💻 实习@Rama Alpaca："
      body: '春季学期开始在北京羊驼科技做 MLE 研究实习，由 MIT 的 <a href="https://guozhang.mit.edu/guos-personal-home">Guo Zhang</a> 博士带教，并与香港科技大学的 <a href="https://www.yingcong.me">Yingcong Chen</a> 教授、波士顿学院的 <a href="https://yyuanad.github.io">Yuan Yuan</a> 教授合作。'
    - date: "[02/2023]"
      tag: "🧑‍💻 科研@武汉大学 CPCS："
      body: '这学期加入武汉大学 <a href="http://yuan.whu.edu.cn">Shengjun Yuan</a> 教授课题组担任研究助理。'
    - date: "[02/2022]"
      tag: "🔬 科研@武汉大学："
      body: '加入武汉大学 <a href="http://jszy.whu.edu.cn/zhangshunping/en/index.htm#">Shunping Zhang</a> 教授的<a href="https://np.whu.edu.cn">课题组</a>，开始本科阶段的科研训练。'

